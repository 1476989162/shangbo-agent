name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # releaseScript.test.ts 的发版门禁要读既有标签（如 v0.9.4）；
      # 实测 checkout 的 fetch-tags 在此次 runner 解析出的 fetch 命令里并未带上
      # --tags（日志为证），改用显式命令拉取标签，与 checkout 版本行为解耦。
      - name: Fetch tags for release preflight gate
        run: git fetch --tags --force origin

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # CI 在海外 runner 上跑，项目根的 .npmrc 指向国内镜像，临时切回官方源
      - name: Use official npm registry
        run: npm config set registry https://registry.npmjs.org/

      # Electron 二进制按版本缓存，避免每次 CI 都重新下载 ~100MB
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (node + web)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # C-Core 集成单测（bridge/refactor/runtimePath）依赖编译产物；
      # Linux 全新 runner 上 bin/ 为空，必须先 gcc 构建再跑单测。
      - name: Build C core (Linux, gcc)
        run: sudo apt-get update && sudo apt-get install -y build-essential && node scripts/build-c.mjs

      - name: Unit tests
        run: npm test

      - name: Relay tests
        run: npm test --prefix relay

      - name: Python sidecar syntax check
        run: python3 -m py_compile python/sidecar.py

      - name: Mobile web build
        run: npm run mobile:build

      # build:c 已在上面的 C 核心步骤里跑过一遍，这里只构建 Electron 产物，避免重复编译
      - name: Build (electron-vite only)
        run: npx electron-vite build


