name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # CI 在海外 runner 上跑，项目根的 .npmrc 指向国内镜像，临时切回官方源
      - name: Use official npm registry
        run: npm config set registry https://registry.npmjs.org/

      # Electron 二进制按版本缓存，避免每次 CI 都重新下载 ~100MB
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (node + web)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Relay tests
        run: npm test --prefix relay

      - name: Python sidecar syntax check
        run: python3 -m py_compile python/sidecar.py

      - name: Mobile web build
        run: npm run mobile:build

      - name: Build C core (Linux, gcc)
        run: sudo apt-get update && sudo apt-get install -y build-essential && node scripts/build-c.mjs

      # build:c 已在 Linux C 核心步骤里跑过一遍，这里只构建 Electron 产物，避免重复编译
      - name: Build (electron-vite only)
        run: npx electron-vite build


