appId: com.shangbo.agent
productName: 尚搏 Agent
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# out/ 是 electron-vite 的产物；package.json 用于读取版本与主进程入口
files:
  - out/**
  - package.json
  - '!**/*.map'

# Python 边车不进 asar，必须以真实文件形式存在才能被 spawn
extraResources:
  - from: python
    to: python
    filter:
      - '**/*.py'

# better-sqlite3 是原生模块，交给 electron-builder 重建到 Electron 的 ABI
npmRebuild: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 尚搏 Agent

# 更新源：electron-builder 据此在 release/ 生成 latest.yml，并把 resources/app-update.yml
# 打进安装包——app-update.yml 是 electron-updater 能工作的前提（缺它就直接抛
# ERR_UPDATER_INVALID_UPDATE_CONFIGURATION）。GitHub provider 读的是仓库 Releases 里的资产。
# 注意：`electron-builder` 本地跑只生成元数据，不会自动发布（默认 publish=onTag），
# 上传仍由 `gh release create` 完成，latest.yml / .blockmap 必须与 exe 一起作为资产上传。
publish:
  provider: github
  owner: 1476989162
  repo: shangbo-agent
  releaseType: release