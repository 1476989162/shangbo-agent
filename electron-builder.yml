appId: com.shangbo.agent
productName: 尚搏 Agent
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# out/ 是 electron-vite 的产物；package.json 用于读取版本与主进程入口
files:
  - out/**
  - package.json
  - '!**/*.map'

# 边车不进 asar，必须以真实文件形式存在才能被 spawn (Python 与 C-Core 原生内核引擎)
extraResources:
  - from: python
    to: python
    filter:
      - '**/*.py'
  - from: c-core/bin
    to: c-core/bin
    filter:
      # 只带运行所需产物：内核引擎本体与依赖 DLL。test_runner.exe 是开发期测试器，
      # 之前的 '**/*' 会把它连同 obj 中间产物一起打进安装包，白白膨胀体积。
      - 'shangbo_agent.exe'
      - 'shangbo_agent'
      - '**/*.dll'

# better-sqlite3 是原生模块，交给 electron-builder 重建到 Electron 的 ABI
npmRebuild: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # 名字必须是纯 ASCII 且与 latest.yml 的 path 完全一致：electron-builder 生成更新
  # 元数据时会把含非 ASCII 的 ${productName} 回退成 `${name}-setup-${version}.${ext}`，
  # 客户端是按 latest.yml 里的文件名去 Releases 下载的，对不上就 404（页面显示名由
  # Release 资产的 label 还原中文，不必靠文件名）。
  artifactName: shangbo-agent-setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 尚搏 Agent

# 更新源：electron-builder 据此在 release/ 生成 latest.yml，并把 resources/app-update.yml
# 打进安装包——app-update.yml 是 electron-updater 能工作的前提（缺它就直接抛
# ERR_UPDATER_INVALID_UPDATE_CONFIGURATION）。GitHub provider 读的是仓库 Releases 里的资产。
# 注意：`electron-builder` 本地跑只生成元数据，不会自动发布（默认 publish=onTag），
# 上传仍由 `gh release create` 完成，latest.yml / .blockmap 必须与 exe 一起作为资产上传。
publish:
  provider: github
  owner: 1476989162
  repo: shangbo-agent
  releaseType: release